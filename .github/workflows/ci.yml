name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, ruff, alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Models e migrações em sincronia
        run: |
          alembic upgrade head
          alembic check
      - name: Testes
        run: pytest

  frontend:
    name: Frontend (vitest, tsc, oxlint, prettier, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Formatação
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
